[package]
name = "ctfd-client-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ctfdc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
urlencoding = "2"
regex = "1"
clap_complete = "4"
rpassword = "7"
ratatui = "0.30.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
unicode-width = "0.2"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
getrandom = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
